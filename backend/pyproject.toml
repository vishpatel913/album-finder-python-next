[project]
name = "music-library-parser-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "vishpatel913",email = "vishpatel913@googlemail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "alembic (>=1.14.0,<2.0.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "spotipy (>=2.23.0,<2.24.0)",
    "pydantic (>=2.13.4,<3.0.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.0"
httpx = "^0.28.0"
ruff = "^0.15.0"
pyright = "^1.1.410"
datamodel-code-generator = "^0.67.0"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# backend/ is the import root (matches Docker), so tests import `libs.*` directly.
pythonpath = ["."]

[tool.pyright]
# "standard" (pyright's default) suits SQLModel/FastAPI: it catches real type
# bugs without drowning in reportUnknown* noise from the untyped ORM boundary.
# "strict" produced ~168 false positives here for no real-bug gain.
typeCheckingMode = "standard"
reportMissingImports = true
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
exclude = [
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "**/types/generated.py",
    "**/migrations/**/*",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Cookie", "fastapi.Body"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# `backend/` is the import root inside Docker, so there is no `backend` package.
# Import from the top-level packages directly, e.g. `from domain.album.model import Album`.
"backend".msg = "Drop the `backend.` prefix — backend/ is the package root (e.g. `from domain...`)."

[tool.ruff.lint.isort]
known-first-party = ["api", "database", "domain", "libs", "scripts"]

[tool.ruff.lint.per-file-ignores]
"generated.py" = ["E501", "UP042"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
