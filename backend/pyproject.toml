[project]
name = "music-library-parser-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "vishpatel913",email = "vishpatel913@googlemail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.28.0"
ruff = "^0.8.0"
pyright = "^1.1.390"

[tool.poetry]
package-mode = false

[tool.pyright]
typeCheckingMode = "strict"
reportMissingImports = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Cookie", "fastapi.Body"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
