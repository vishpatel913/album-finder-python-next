services:
  api:
    build: ./backend
    container_name: album-finder-backend
    ports:
      - "8004:8000"
    environment:
      - ENVIRONMENT=dev
      - TESTING=0
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/music_library
      # - DATABASE_TEST_URL=postgresql://postgres:postgres@database:5432/music_library_test
    depends_on:
      database:
        condition: service_healthy

  # Database
  database:
    image: postgres:16
    container_name: album-finder-database
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=music_library
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d music_library"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vite dev server (React SPA). Browse to http://localhost:5173
  # The dev server proxies /api -> the api service, so no CORS needed.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: album-finder-web
    ports:
      - "5173:5173"
    environment:
      # Vite's dev proxy forwards /api -> this target over the compose network.
      - VITE_PROXY_TARGET=http://api:8000
    volumes:
      # Bind-mount source for HMR; keep the image's node_modules.
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

  # Web DB admin UI. Browse to http://localhost:5050
  #   login: admin@admin.com / admin
  # The music_library server is pre-registered (see pgadmin/servers.json); you
  # only enter the DB password (postgres) the first time you expand it.
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False # skip the per-user login wall
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      database:
        condition: service_healthy

volumes:
  # album-finder-data:
  pgdata:
  pgadmin_data:
