services:
  api:
    build: ./
    command: uvicorn src.main:app --reload --workers 1 --host 0.0.0.0 --port 8000
    volumes:
      - ./:/usr/src/app
    ports:
      - "8004:8000"
    environment:
      - ENVIRONMENT=dev
      - TESTING=0
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/music_library
      # - DATABASE_TEST_URL=postgresql://postgres:postgres@database:5432/music_library_test
    depends_on:
      - database

  # Database
  database:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=music_library
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d music_library"]
      interval: 10s
      timeout: 5s
      retries: 5

